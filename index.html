<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Trivial Duelo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f9fafb;background:#101827}*{box-sizing:border-box}body{margin:0;padding:20px 12px}.wrap{max-width:580px;margin:auto}.hero{text-align:center;margin:20px 0 26px}.hero h1{font-size:clamp(30px,8vw,46px);margin:8px}.hero p{color:#bac6d8}.panel{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:22px;margin-bottom:14px;box-shadow:0 8px 30px #0002}select{font:inherit;padding:12px;border-radius:12px;width:100%;background:#101827;color:white;margin-top:10px}input,button{font:inherit;border-radius:12px;padding:14px;width:100%;margin-top:10px}input{background:#101827;border:1px solid #64748b;color:white}button{border:0;background:#7c3aed;color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#334155}.hidden{display:none!important}.code{font-size:42px;letter-spacing:7px;font-weight:850;text-align:center;color:#c4b5fd;margin:15px}.muted{color:#b9c5d7}.players{display:flex;gap:10px;margin:14px 0}.player{flex:1;background:#111827;border-radius:12px;padding:12px;text-align:center;overflow-wrap:anywhere}.score{font-size:25px;font-weight:800}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.timer{font-size:28px;font-weight:800;color:#fbbf24}.bar{height:9px;border-radius:20px;background:#334155;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:100%;background:#a78bfa;transition:width .2s linear}.category{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#c4b5fd;font-weight:800}.question{font-size:23px;line-height:1.3;font-weight:750;margin:16px 0}.option{text-align:left;background:#334155;margin:10px 0;min-height:56px}.option.selected{outline:3px solid #a78bfa}.option.correct{background:#166534}.option.wrong{background:#991b1b}.status{margin-top:16px;color:#d8b4fe;min-height:24px}.error{background:#7f1d1d;padding:14px;border-radius:12px;margin-bottom:14px}.small{font-size:13px}.result{text-align:center;font-size:24px;font-weight:800}a{color:#c4b5fd}</style></head><body><div class="wrap"><header class="hero"><div style="font-size:44px">🧠⚡</div><h1>TRIVIAL DUELO</h1><p>Dos móviles · 20 preguntas · 20 segundos</p></header><div id="error" class="error hidden"></div><section id="home" class="panel"><h2>Entrar a jugar</h2><label>Tu nombre<input id="name" maxlength="22" placeholder="Ej. Ana" autocomplete="nickname"></label><label>Nivel de la partida<select id="difficulty"><option value="mixed">Mixto</option><option value="easy">Fácil</option><option value="medium">Medio</option><option value="hard">Difícil</option></select></label><button id="create">Crear sala</button><p class="muted" style="text-align:center">— o únete a una sala —</p><label>Código de 5 caracteres<input id="joincode" maxlength="5" placeholder="ABCDE" autocapitalize="characters"></label><button id="join" class="secondary">Unirse</button></section><section id="lobby" class="panel hidden"><h2>Sala de espera</h2><p class="muted">Comparte este código con el otro jugador:</p><div class="code" id="roomcode"></div><button id="share" class="secondary">Compartir invitación</button><div id="lobbyplayers" class="players"></div><p class="muted" id="waitmsg"></p><button id="start" class="hidden">¡Empezar partida!</button></section><section id="game" class="panel hidden"><div class="top"><span id="progress"></span><span class="timer" id="timer">20</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="scores" class="players"></div><div class="category" id="category"></div><div class="question" id="question"></div><div id="options"></div><div class="status" id="status" aria-live="polite"></div></section><section id="end" class="panel hidden"><h2>🏆 Resultado final</h2><div id="winner" class="result"></div><div id="finalscores" class="players"></div><button onclick="location.reload()">Nueva partida</button></section><p class="muted small" style="text-align:center">Mantén la página abierta durante la partida. Si un jugador se desconecta, la partida finaliza.</p></div><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let myId,room,answered=false,deadline=0,interval;const show=id=>['home','lobby','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id));const error=m=>{$('error').textContent=m;$('error').classList.remove('hidden');setTimeout(()=>$('error').classList.add('hidden'),6000)};const name=()=> $('name').value.trim();
$('create').onclick=()=>{if(!name())return error('Introduce tu nombre.');s.emit('create',{name:name(),difficulty:$('difficulty').value})};$('join').onclick=()=>{if(!name())return error('Introduce tu nombre.');s.emit('join',{name:name(),code:$('joincode').value})};$('start').onclick=()=>s.emit('start');$('share').onclick=async()=>{const url=location.origin+'/?room='+room.code;try{if(navigator.share)await navigator.share({title:'Trivial Duelo',text:'Entra en mi sala '+room.code,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$('share').textContent='¡Enlace copiado!';}else prompt('Copia el enlace',url)}catch{}};
const params=new URLSearchParams(location.search);if(params.has('room'))$('joincode').value=params.get('room').toUpperCase();
s.on('connect',()=>{myId=s.id});s.on('errorMessage',error);s.on('room',r=>{room=r;$('roomcode').textContent=r.code;const markup=r.players.map(p=>`<div class="player"><strong>${escapeHTML(p.name)}</strong><div class="score">${p.score}</div></div>`).join('');$('lobbyplayers').innerHTML=markup;$('scores').innerHTML=markup;$('waitmsg').textContent=r.players.length===1?'Esperando al segundo jugador…':'¡Los dos jugadores están listos!';$('start').classList.toggle('hidden',r.players.length!==2||r.status!=='waiting'||(r.hostId?r.hostId!==myId:r.players[0].name!==name()));if(r.status==='waiting')show('lobby')});
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
s.on('question',q=>{answered=false;deadline=q.deadline;show('game');$('progress').textContent=`Pregunta ${q.round} / ${q.total}`;$('category').textContent=q.category+' · '+({easy:'Fácil',medium:'Medio',hard:'Difícil'}[q.difficulty]||'')+(q.cefr?' · '+q.cefr:'');$('question').textContent=q.text;$('status').textContent='Selecciona una respuesta';$('options').replaceChildren();q.options.forEach((option,i)=>{const b=document.createElement('button');b.className='option';b.textContent=`${'ABCD'[i]}. ${option}`;b.onclick=()=>{if(answered)return;s.emit('answer',{index:i});};$('options').append(b)});clearInterval(interval);interval=setInterval(tick,100);tick()});
function tick(){const left=Math.max(0,(deadline-Date.now())/1000);$('timer').textContent=Math.ceil(left);$('fill').style.width=(left/20*100)+'%';if(left===0){clearInterval(interval);$('status').textContent='Tiempo agotado. Esperando resultado…';[...$('options').children].forEach(b=>b.disabled=true)}}
s.on('answered',({index})=>{answered=true;[...$('options').children].forEach((b,i)=>{b.disabled=true;if(i===index)b.classList.add('selected')});$('status').textContent='Respuesta enviada. Esperando al rival…'});
s.on('reveal',r=>{clearInterval(interval);[...$('options').children].forEach((b,i)=>{b.disabled=true;if(i===r.correct)b.classList.add('correct');else if(b.classList.contains('selected'))b.classList.add('wrong')});$('status').textContent=`Respuesta correcta: ${'ABCD'[r.correct]}. ${r.explanation}`;$('scores').innerHTML=r.answers.map(p=>`<div class="player"><strong>${escapeHTML(p.name)}</strong><div class="score">${p.score}</div></div>`).join('')});
s.on('finished',r=>{clearInterval(interval);show('end');const sorted=[...r.players].sort((a,b)=>b.score-a.score);$('winner').textContent=sorted.length<2||sorted[0].score===sorted[1].score?'¡Empate!':`¡Gana ${sorted[0].name}!`;$('finalscores').innerHTML=sorted.map(p=>`<div class="player"><strong>${escapeHTML(p.name)}</strong><div class="score">${p.score} pts</div></div>`).join('')});s.on('disconnect',()=>error('Conexión perdida. Comprueba Internet y recarga para crear una nueva sala.'));
</script></body></html>
